    let quizSet = [], currentIdx = 0, score = 0, selected = [], results = [], userInfo = {};
    function prepareQuiz() {
        userInfo = { name: document.getElementById('name').value.trim() };
        if (!userInfo.name) return alert("성명을 입력하세요.");
        if (!Array.isArray(allQuestions) || allQuestions.length < 10) {
            document.body.innerHTML = '<div class="container"><p style="color:red; text-align:center;">오류: 퀴즈를 생성하기에 문제 수가 부족합니다. PDF 파일을 확인해주세요.</p></div>';
            return;
        }
        quizSet = [...allQuestions].sort(() => Math.random() - 0.5).slice(0, 10);
        currentIdx = 0; score = 0; results = [];
        document.getElementById('setup-page').classList.add('hidden');
        document.getElementById('quiz-page').classList.remove('hidden');
        loadQuestion();
    }
    function loadQuestion() {
        if (currentIdx >= quizSet.length) { finishQuiz(); return; }
        const item = quizSet[currentIdx];
        document.getElementById('question-text').innerText = item.q;
        document.getElementById('progress-inner').style.width = ((currentIdx + 1) / 10 * 100) + "%";
        const area = document.getElementById('options-area');
        area.innerHTML = ''; selected = [];
        item.opts.forEach(opt => {
            const b = document.createElement('button');
            b.className = 'btn-option'; b.innerText = opt;
            b.onclick = () => {
                b.classList.toggle('selected');
                if (selected.includes(opt)) selected = selected.filter(s => s !== opt);
                else selected.push(opt);
            };
            area.appendChild(b);
        });
    }

        if (selected.length === 0) return alert("최소 하나 이상의 정답을 선택하세요.");
        const item = quizSet[currentIdx];
        const isCorrect = JSON.stringify([...selected].sort()) === JSON.stringify([...item.ans].sort());
        results.push({ q: item.q, user: selected.join(", "), ans: item.ans.join(", "), isCorrect });
        if (isCorrect) score++;
        currentIdx++;
        loadQuestion();
    }
    function finishQuiz() {
        document.getElementById('quiz-page').classList.add('hidden');
        document.getElementById('result-page').classList.remove('hidden');
        document.getElementById('user-display').innerText = userInfo.name;
        document.getElementById('final-score').innerText = score;
        const wrongList = results.filter(r => !r.isCorrect);
        if (wrongList.length > 0) {
            document.getElementById('wrong-section').classList.remove('hidden');
            const area = document.getElementById('wrong-list');
            area.innerHTML = '';
            wrongList.forEach(w => {
                area.innerHTML += `<div class="wrong-item"><strong>Q: ${w.q}</strong><br>내 답: <span style="color:red">${w.user}</span> | 정답: <span style="color:green">${w.ans}</span></div>`;
            });
        }
    }
    function downloadResult() {
        const txt = `[테스트 결과] 성명: ${userInfo.name}\n점수: ${score}/10\n\n` + results.map(r => `${r.isCorrect?'[O]':'[X]'} ${r.q}\n(답: ${r.user} / 정답: ${r.ans})`).join('\n\n');
        const blob = new Blob([txt], {type:'text/plain'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `${userInfo.name}_성적.txt`; a.click(); URL.revokeObjectURL(a.href);
    }
</script>
</body>
</html>
