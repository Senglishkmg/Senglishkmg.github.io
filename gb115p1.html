<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>15. 전치사 - Pattern 01</title>
    <style>
        :root {
            /* 14단원(접속사) 테마에 맞춰 산뜻한 그린 계열로 색상을 유지했습니다 */
            --primary-color: #12b886; 
            --bg-color: #e6fcf5;
            --card-bg: #ffffff;
            --text-main: #2d3436;
        }

        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            padding: 2.5rem 2rem;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(18, 184, 134, 0.1);
            text-align: center;
        }

        .back-btn {
            display: inline-block;
            text-decoration: none;
            color: #aaa;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            transition: color 0.2s;
        }
        .back-btn:hover { color: var(--primary-color); }

        h1 {
            font-size: 1.5rem;
            color: var(--text-main);
            margin-bottom: 0.3rem;
        }

        .sub-title {
            color: var(--primary-color);
            font-weight: 600;
            margin-bottom: 2rem;
            display: block;
        }

        .part-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .part-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            background: #fff;
            border: 2px solid #f1f3f5;
            border-radius: 12px;
            padding: 1.2rem 1.5rem;
            color: var(--text-main);
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.2s ease;
        }

        .part-item::after {
            content: '→';
            font-size: 1.2rem;
            color: #dee2e6;
            transition: transform 0.2s;
        }

        .part-item:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
            background-color: #f1fcf8;
            transform: scale(1.02);
        }

        .part-item:hover::after {
            color: var(--primary-color);
            transform: translateX(5px);
        }

        .footer {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #adb5bd;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 15단원 패턴 선택 페이지(gb115.html)로 돌아가도록 링크 수정 -->
        <a href="gb115.html" class="back-btn">← Pattern 선택으로</a>
        
        <h1>Pattern 01</h1>
        <span class="sub-title">Part 선택</span>
        
        <!-- 4개의 파트로 구성 -->
        <div class="part-list">
            <a href="gb115p1p01.html" class="part-item">Part 01 - 01</a>
            <a href="gb115p1p02.html" class="part-item">Part 01 - 02</a>
            <a href="gb115p1p03.html" class="part-item">Part 01 - 03</a>
            <a href="gb115p1p04.html" class="part-item">Part 01 - 04</a>
        </div>

        <div class="footer">
            문장 구조를 익히며 열공하세요!
        </div>
    </div>

</body>
</html>
